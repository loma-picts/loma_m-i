<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NETZ-CHECK – Dein interaktiver Web-Führerschein</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --border: #e2e8f0;
      --secondary: #f1f5f9;
      --secondary-foreground: #1e293b;
      --muted-foreground: #64748b;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
    }
    html.dark {
      --background: #0b0f19;
      --foreground: #f1f5f9;
      --card: #151c2c;
      --border: #263147;
      --secondary: #1e293b;
      --secondary-foreground: #e2e8f0;
      --muted-foreground: #94a3b8;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
    }
    /* Offline / Firewall Fallback Utilities */
    .bg-\[var\(--background\)\] { background-color: var(--background); }
    .bg-\[var\(--card\)\] { background-color: var(--card); }
    .bg-\[var\(--secondary\)\] { background-color: var(--secondary); }
    .bg-\[var\(--primary\)\] { background-color: var(--primary); }
    .text-\[var\(--foreground\)\] { color: var(--foreground); }
    .text-\[var\(--muted-foreground\)\] { color: var(--muted-foreground); }
    .text-\[var\(--secondary-foreground\)\] { color: var(--secondary-foreground); }
    .text-\[var\(--primary-foreground\)\] { color: var(--primary-foreground); }
    .border-\[var\(--border\)\] { border-color: var(--border); }
    .border-\[var\(--primary\)\] { border-color: var(--primary); }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .touch-btn {
      min-height: 46px;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-btn:active {
      transform: scale(0.97);
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .streak-pulse {
      animation: pulseGlow 1.4s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen pb-16">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-30 bg-[var(--card)] border-b border-[var(--border)] px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <!-- Brand / Home Button -->
      <button onclick="showDashboard()" class="touch-btn flex items-center gap-2.5 text-left px-2 py-1 rounded-xl hover:bg-[var(--secondary)]">
        <span class="text-2xl">🛡️</span>
        <div>
          <div class="font-bold text-base leading-tight flex items-center gap-2">
            <span>NETZ-CHECK</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)] font-medium">iPad-Edition</span>
          </div>
          <div class="text-xs text-[var(--muted-foreground)]">Online-Grundlagen (Teil 1–3)</div>
        </div>
      </button>

      <!-- Stats & Quick Actions -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- XP Counter -->
        <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-sm font-semibold">
          <span>⚡</span>
          <span id="xpDisplay">0</span>
          <span class="text-xs text-[var(--muted-foreground)]">XP</span>
        </div>

        <!-- Streak Counter -->
        <div id="streakBadge" class="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-sm font-semibold">
          <span>🔥</span>
          <span id="streakDisplay">0</span>
        </div>

        <!-- Glossary / Spickzettel Button -->
        <button onclick="openGlossary()" class="touch-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] text-sm font-medium hover:bg-[var(--secondary)]">
          <span>📖</span>
          <span class="hidden sm:inline">Lexikon (45)</span>
        </button>

        <!-- Theme Toggle -->
        <button onclick="document.documentElement.classList.toggle('dark')" class="touch-btn px-3 py-1.5 rounded-xl border border-[var(--border)] bg-[var(--background)] text-sm font-medium" aria-label="Design wechseln">🌓</button>

        <!-- Certificate / Lehrer-Nachweis Button -->
        <button onclick="openCertificate()" class="touch-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-semibold shadow-sm">
          <span>🏆</span>
          <span>Abgabe-Pass</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="appMain" class="max-w-4xl mx-auto px-4 pt-5">
    <!-- Dynamic Content injected by JS -->
  </main>

  <!-- MODAL FOR GLOSSARY & CERTIFICATE -->
  <div id="modalOverlay" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="modalContent" class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl max-w-2xl w-full max-h-[88vh] flex flex-col shadow-xl overflow-hidden animate-pop">
      <!-- Injected dynamically -->
    </div>
  </div>

    function getCardImageKey(term) {
      const t = term.toLowerCase();
      if (t.includes("lan") || t.includes("wlan")) return "router";
      if (t.includes("isp") || t.includes("provider")) return "router";
      if (t.includes("ip-adresse")) return "schoolLan";
      if (t.includes("url") || t.includes("browser") || t.includes("favoriten") || t.includes("startseite") || t.includes("html") || t.includes("www")) return "uiBrowserUrl";
      if (t.includes("4g") || t.includes("5g") || t.includes("sms") || t.includes("soziale")) return "mobile5g";
      if (t.includes("attachment") || t.includes("ordner") || t.includes("bcc") || t.includes("verteilerliste") || t.includes("e-mail")) return "uiEmailBcc";
      if (t.includes("podcast") || t.includes("blog") || t.includes("enzyklopädie")) return "podcast";
      if (t.includes("e-commerce") || t.includes("seriöse")) return "ecommerce";
      if (t.includes("e-government") || t.includes("e-banking")) return "uiEgovEbanking";
      if (t.includes("e-learning")) return "schoolLan";
      if (t.includes("urheberrecht")) return "podcast";
      if (t.includes("zertifikat") || t.includes("https")) return "uiHttpsCert";
      if (t.includes("cookies")) return "uiCookiesPopup";
      if (t.includes("chronik") || t.includes("autovervollständigen")) return "uiFirefoxChronik";
      return "security";
    }

    function getQuizImageKey(questionText) {
      const q = questionText.toLowerCase();
      if (q.includes("firefox") || q.includes("autovervollständigen")) return "uiFirefoxChronik";
      if (q.includes("cookies")) return "uiCookiesPopup";
      if (q.includes("zertifikat") || q.includes("https")) return "uiHttpsCert";
      if (q.includes("amtswegen") || q.includes("behördengänge")) return "uiEgovEbanking";
      if (q.includes("elektronischer handel")) return "ecommerce";
      if (q.includes("urheberrecht") || q.includes("schutzfrist")) return "podcast";
      if (q.includes("impressum")) return "ecommerce";
      if (q.includes("anhang") || q.includes("spam") || q.includes("bcc") || q.includes("verteilerliste") || q.includes("e-mail") || q.includes("gmail")) return "uiEmailBcc";
      if (q.includes("mobilfunk")) return "mobile5g";
      if (q.includes("lokales netzwerk") || q.includes("schulen oder firmen")) return "schoolLan";
      if (q.includes("isp") || q.includes("provider")) return "router";
      if (q.includes("webbrowser") || q.includes("favoriten") || q.includes("adresse einer webseite") || q.includes("markup")) return "uiBrowserUrl";
      if (q.includes("ip-adresse")) return "router";
      return "security";
    }

    function renderMediaBox(imageKey, compact = false) {
      const item = MEDIA_GALLERY[imageKey];
      if (!item) return "";
      return `
        <div class="rounded-2xl overflow-hidden border border-[var(--border)] bg-[var(--background)] shadow-xs">
          <div class="relative group cursor-pointer" onclick="openImageLightbox('${imageKey}')">
            <img
              src="${item.src}"
              alt="${item.caption}"
              class="w-full ${compact ? 'h-40 sm:h-48' : 'h-48 sm:h-60'} object-cover bg-slate-900"
            />
            <span class="absolute bottom-2 right-2 px-2.5 py-1 rounded-lg bg-black/70 text-white text-xs font-semibold backdrop-blur-xs">
              🔍 Antippen zum Vergrössern
            </span>
          </div>
          <div class="px-3.5 py-2 text-xs text-[var(--muted-foreground)] border-t border-[var(--border)] bg-[var(--card)]">
            ${item.caption}
          </div>
        </div>
      `;
    }

    function openImageLightbox(imageKey) {
      const item = MEDIA_GALLERY[imageKey];
      if (!item) return;
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalContent");
      overlay.classList.remove("hidden");
      content.innerHTML = `
        <div class="p-4 border-b border-[var(--border)] flex items-center justify-between gap-2">
          <div class="font-bold text-sm sm:text-base">🖼️ Bild-Ansicht</div>
          <button onclick="closeModal()" class="touch-btn px-3.5 py-1.5 rounded-xl bg-[var(--secondary)] font-bold text-sm">
            ✕ Schliessen
          </button>
        </div>
        <div class="p-4 overflow-y-auto space-y-3 bg-slate-950 flex flex-col items-center">
          <img src="${item.src}" alt="${item.caption}" class="max-h-[68vh] w-auto rounded-xl object-contain" />
        </div>
        <div class="p-3.5 text-xs sm:text-sm font-medium border-t border-[var(--border)] bg-[var(--card)]">
          ${item.caption}
        </div>
      `;
    }

            explanation: "Laut PDF 3 gibt es die zeitliche Einschränkung (Kindersicherung/Modem) und die inhaltliche Einschränkung (Inhaltsfilter)."
          }
        ]
      }
    ];

    // ============================================================================
    // STATE MANAGEMENT (Persisted in localStorage)
    // ============================================================================
    const STORAGE_KEY = "netz_check_state_v1";
    let state = {
      studentName: "",
      xp: 0,
      streak: 0,
      bestStreak: 0,
      easyMode: true, // true = Einfach erklärt, false = Prüfungs-Wissen
      completed: {
        // levelId: { cards: false, game: false, quiz: false }
        1: { cards: false, game: false, quiz: false },
        2: { cards: false, game: false, quiz: false },
        3: { cards: false, game: false, quiz: false },
        4: { cards: false, game: false, quiz: false }
      },
      seenCards: { 1: [], 2: [], 3: [], 4: [] }
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed, completed: { ...state.completed, ...(parsed.completed || {}) } };
        }
      } catch (e) {}
      updateHeaderStats();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateHeaderStats();
    }

    function addXP(amount, incrementStreak = false) {
      state.xp += amount;
      if (incrementStreak) {
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      }
      saveState();
    }

    function resetStreak() {
      state.streak = 0;
      saveState();
    }

    function updateHeaderStats() {
      const xpEl = document.getElementById("xpDisplay");
      const streakEl = document.getElementById("streakDisplay");
      const badgeEl = document.getElementById("streakBadge");
      if (xpEl) xpEl.textContent = state.xp;
      if (streakEl) streakEl.textContent = state.streak;
      if (badgeEl) {
        if (state.streak >= 3) badgeEl.classList.add("streak-pulse");
        else badgeEl.classList.remove("streak-pulse");
      }
    }

    // ============================================================================
    // SPEECH SYNTHESIS (Vorlese-Funktion für schwache Leser / DaZ)
    // ============================================================================
    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = "de-DE";
      utter.rate = 0.98;
      window.speechSynthesis.speak(utter);
    }

    // ============================================================================
    // NAVIGATION & VIEWS
    // ============================================================================
    let currentLevelId = null;
    let currentPhase = "cards"; // "cards" | "game" | "quiz"
    let currentCardIndex = 0;

    function showDashboard() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      currentLevelId = null;
      const main = document.getElementById("appMain");

      // Calculate overall progress
      let totalTasks = 12;
      let doneTasks = 0;
      [1, 2, 3, 4].forEach(id => {
        if (state.completed[id]?.cards) doneTasks++;
        if (state.completed[id]?.game) doneTasks++;
        if (state.completed[id]?.quiz) doneTasks++;
      });
      const pct = Math.round((doneTasks / totalTasks) * 100);

      main.innerHTML = `
        <div class="space-y-6 animate-pop">
          <!-- Welcome & Name Banner -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 shadow-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="space-y-1">
                <div class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-wider px-2.5 py-1 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)]">
                  <span>🎯 Interaktives Training</span>
                  <span>•</span>
                  <span>Alle 3 Arbeitsblätter</span>
                </div>
                <h1 class="text-2xl font-bold pt-1">
                  ${state.studentName ? `Hallo, ${escapeHtml(state.studentName)}! 👋` : "Mach deinen Web-Führerschein! 🚀"}
                </h1>
                <p class="text-sm text-[var(--muted-foreground)]">
                  Lerne die Begriffe mit kurzen Karten, Mini-Games und dem Boss-Quiz – ganz ohne Papierkram.
                </p>
              </div>

              <!-- Student Name Input for Certificate -->
              <div class="flex items-center gap-2 bg-[var(--background)] p-2 rounded-xl border border-[var(--border)]">
                <input
                  id="studentNameInput"
                  type="text"
                  placeholder="Dein Vorname / Name..."
                  value="${escapeHtml(state.studentName)}"
                  oninput="updateStudentName(this.value)"
                  class="bg-transparent px-3 py-2 text-sm font-medium focus:outline-none w-44 sm:w-52"
                />
                <span class="text-xs px-2.5 py-1.5 rounded-lg bg-[var(--secondary)] text-[var(--muted-foreground)] font-medium">
                  ✏️ Für Pass
                </span>
              </div>
            </div>

            <!-- Overall Progress Bar -->
            <div class="mt-5 pt-4 border-t border-[var(--border)]">
              <div class="flex justify-between items-center text-xs font-semibold mb-2">
                <span>Gesamt-Fortschritt (${doneTasks} von ${totalTasks} Missionen erledigt)</span>
                <span>${pct}%</span>
              </div>
              <div class="w-full h-3 bg-[var(--secondary)] rounded-full overflow-hidden">
                <div class="h-full bg-[var(--primary)] transition-all duration-500 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          </div>

          <!-- Language Level Switcher Banner -->
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${state.easyMode ? "🟢" : "🔵"}</span>
              <div>
                <div class="font-semibold text-sm">Erklär-Stufe: ${state.easyMode ? "Einfach & Jugendgerecht (Empfohlen)" : "Original Prüfungs-Fakten (PDF-Wortlaut)"}</div>
                <div class="text-xs text-[var(--muted-foreground)]">Du kannst jederzeit zwischen kurzer Alltags-Erklärung und den genauen Prüfungs-Sätzen umschalten.</div>
              </div>
            </div>
            <button onclick="toggleEasyMode()" class="touch-btn px-4 py-2 rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-xs font-bold shrink-0 hover:opacity-90">
              🔄 Auf «${state.easyMode ? "Prüfungs-Fakten" : "Einfach erklärt"}» wechseln
            </button>
          </div>

          <!-- 4 Level Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${LEVELS.map(lvl => renderLevelCard(lvl)).join("")}
          </div>
        </div>
      `;
    }

    function renderLevelCard(lvl) {
      const comp = state.completed[lvl.id] || { cards: false, game: false, quiz: false };
      const doneCount = (comp.cards ? 1 : 0) + (comp.game ? 1 : 0) + (comp.quiz ? 1 : 0);
      const isAllDone = doneCount === 3;

      const heroImg = MEDIA_GALLERY[LEVEL_HERO_IMAGES[lvl.id]];
      return `
        <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl overflow-hidden flex flex-col justify-between shadow-sm hover:shadow-md transition-shadow">
          <div>
            ${heroImg ? `
              <div class="relative h-36 w-full overflow-hidden border-b border-[var(--border)] cursor-pointer" onclick="openLevel(${lvl.id}, '${!comp.cards ? "cards" : !comp.game ? "game" : "quiz"}')">
                <img src="${heroImg.src}" alt="${lvl.title}" class="w-full h-full object-cover" />
                <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
                <span class="absolute bottom-2.5 left-3.5 text-white text-xs font-bold px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-xs">
                  ${lvl.icon} ${lvl.cards.length} Begriffe • ${lvl.quiz.length} Prüfungsfragen
                </span>
                <span class="absolute top-2.5 right-2.5 text-xs font-bold px-2.5 py-1 rounded-full ${isAllDone ? "bg-emerald-500 text-white" : "bg-black/70 text-white"}">
                  ${isAllDone ? "✅ Komplett" : `${doneCount}/3 erledigt`}
                </span>
              </div>
            ` : ""}
            <div class="p-5 pb-0">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[var(--secondary)] flex items-center justify-center text-2xl shrink-0">
                  ${lvl.icon}
                </div>
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">
                    ${lvl.cards.length} Begriffe • ${lvl.quiz.length} Prüfungsfragen
                  </span>
                  <h2 class="font-bold text-base leading-snug">${lvl.title}</h2>
                </div>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isAllDone ? "bg-emerald-500/20 text-emerald-500" : "bg-[var(--secondary)] text-[var(--muted-foreground)]"}">
                ${isAllDone ? "✅ Komplett" : `${doneCount}/3`}
              </span>
            </div>

            <p class="text-xs text-[var(--muted-foreground)] mt-2.5">
              ${lvl.subtitle}
            </p>

            <!-- 3 Phase Pills -->
            <div class="grid grid-cols-3 gap-2 mt-4">
              <button onclick="openLevel(${lvl.id}, 'cards')" class="touch-btn flex flex-col items-center justify-center p-2 rounded-xl border border-[var(--border)] ${comp.cards ? "bg-emerald-500/10 border-emerald-500/40" : "bg-[var(--background)]"} text-xs font-semibold">
                <span class="text-base">${comp.cards ? "✅" : "🃏"}</span>
                <span class="mt-0.5">1. Karten</span>
              </button>
              <button onclick="openLevel(${lvl.id}, 'game')" class="touch-btn flex flex-col items-center justify-center p-2 rounded-xl border border-[var(--border)] ${comp.game ? "bg-emerald-500/10 border-emerald-500/40" : "bg-[var(--background)]"} text-xs font-semibold">
                <span class="text-base">${comp.game ? "✅" : "🎮"}</span>
                <span class="mt-0.5">2. Praxis</span>
              </button>
              <button onclick="openLevel(${lvl.id}, 'quiz')" class="touch-btn flex flex-col items-center justify-center p-2 rounded-xl border border-[var(--border)] ${comp.quiz ? "bg-emerald-500/10 border-emerald-500/40" : "bg-[var(--background)]"} text-xs font-semibold">
                <span class="text-base">${comp.quiz ? "✅" : "🏆"}</span>
                <span class="mt-0.5">3. Quiz</span>
              </button>
            </div>
          </div>

            </div>
          </div>
          <div class="p-5 pt-4">
            <button onclick="openLevel(${lvl.id}, '${!comp.cards ? "cards" : !comp.game ? "game" : "quiz"}')" class="touch-btn w-full py-2.5 px-4 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] font-semibold text-sm flex items-center justify-center gap-2">
              <span>${doneCount === 0 ? "Level starten" : isAllDone ? "Nochmals üben" : "Weitermachen"}</span>
              <span>→</span>
            </button>
          </div>
        </div>
      `;
    }

    function updateStudentName(val) {
      state.studentName = val.trim();
      saveState();
    }

    function toggleEasyMode() {
      state.easyMode = !state.easyMode;
      saveState();
      if (currentLevelId === null) showDashboard();
      else if (currentPhase === "cards") renderCardsPhase();
    }

    // ============================================================================
    // LEVEL CONTAINER & PHASE SWITCHER
    // ============================================================================
    function openLevel(levelId, phase = "cards") {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      currentLevelId = levelId;
      currentPhase = phase;
      currentCardIndex = 0;

      if (phase === "cards") renderCardsPhase();
      else if (phase === "game") renderGamePhase();
      else if (phase === "quiz") initQuizPhase();
    }

    function renderLevelHeader(lvl) {
      const comp = state.completed[lvl.id] || { cards: false, game: false, quiz: false };
      return `
        <div class="mb-5 space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <button onclick="showDashboard()" class="touch-btn inline-flex items-center gap-1.5 text-sm font-semibold px-3 py-1.5 rounded-xl bg-[var(--card)] border border-[var(--border)]">
              <span>←</span>
              <span>Alle Levels</span>
            </button>
            <div class="text-sm font-bold flex items-center gap-2">
              <span>${lvl.icon}</span>
              <span>${lvl.title}</span>
            </div>
          </div>

          <!-- Phase Tabs -->
          <div class="grid grid-cols-3 gap-2 bg-[var(--card)] p-1.5 rounded-2xl border border-[var(--border)]">
            <button onclick="openLevel(${lvl.id}, 'cards')" class="touch-btn py-2 px-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 ${currentPhase === "cards" ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)] hover:bg-[var(--secondary)]"}">
              <span>${comp.cards ? "✅" : "🃏"}</span>
              <span>1. Begriffe (${lvl.cards.length})</span>
            </button>
            <button onclick="openLevel(${lvl.id}, 'game')" class="touch-btn py-2 px-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 ${currentPhase === "game" ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)] hover:bg-[var(--secondary)]"}">
              <span>${comp.game ? "✅" : "🎮"}</span>
              <span>2. Praxis-Labor</span>
            </button>
            <button onclick="openLevel(${lvl.id}, 'quiz')" class="touch-btn py-2 px-3 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-1.5 ${currentPhase === "quiz" ? "bg-[var(--primary)] text-[var(--primary-foreground)]" : "text-[var(--muted-foreground)] hover:bg-[var(--secondary)]"}">
              <span>${comp.quiz ? "✅" : "🏆"}</span>
              <span>3. Boss-Quiz (${lvl.quiz.length})</span>
            </button>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // PHASE 1: INTERACTIVE FLASHCARDS (SWIPE & CHECK)
    // ============================================================================
    function renderCardsPhase() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      const card = lvl.cards[currentCardIndex];

      // Mark card as seen
      if (!state.seenCards[lvl.id]) state.seenCards[lvl.id] = [];
      if (!state.seenCards[lvl.id].includes(currentCardIndex)) {
        state.seenCards[lvl.id].push(currentCardIndex);
        addXP(5, false);
      }
      if (state.seenCards[lvl.id].length >= lvl.cards.length && !state.completed[lvl.id].cards) {
        state.completed[lvl.id].cards = true;
        addXP(25, true);
      }
      saveState();

      const main = document.getElementById("appMain");
      main.innerHTML = `
        <div class="animate-pop">
          ${renderLevelHeader(lvl)}

          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 sm:p-6 shadow-sm">
            <!-- Top bar inside card -->
            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-[var(--border)]">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-[var(--secondary)]">
                  Karte ${currentCardIndex + 1} von ${lvl.cards.length}
                </span>
                <span class="text-xs text-[var(--muted-foreground)] font-medium">
                  (${card.pdfSource})
                </span>
              </div>

              <div class="flex items-center gap-2">
                <!-- Read Aloud Button -->
                <button onclick="speakCurrentCard()" class="touch-btn px-3 py-1.5 rounded-xl bg-[var(--secondary)] text-xs font-bold flex items-center gap-1.5">
                  <span>🔊</span>
                  <span>Vorlesen</span>
                </button>

                <!-- Easy vs Exam Toggle -->
                <button onclick="toggleEasyMode()" class="touch-btn px-3 py-1.5 rounded-xl border border-[var(--border)] text-xs font-bold flex items-center gap-1.5">
                  <span>${state.easyMode ? "🟢 Einfach" : "🔵 Prüfungs-Text"}</span>
                  <span class="underline">Umschalten</span>
                </button>
              </div>
            </div>

            <!-- Main Card Body -->
            <div class="py-6 space-y-4">
              <div class="flex items-center gap-3.5">
                <div class="w-14 h-14 rounded-2xl bg-[var(--secondary)] flex items-center justify-center text-3xl shrink-0">
                  ${card.icon}
                </div>
                <div>
                  <div class="text-xs uppercase font-bold tracking-wider text-[var(--muted-foreground)]">Fachbegriff</div>
                  <h2 class="text-xl sm:text-2xl font-extrabold">${card.term}</h2>
                </div>
              </div>

              <!-- Visual Real Photo / Program Screenshot -->
              ${renderMediaBox(getCardImageKey(card.term), false)}

              <!-- Explanation Box -->
              <div class="p-4 rounded-2xl bg-[var(--background)] border border-[var(--border)] space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-[var(--secondary)]">
                    ${state.easyMode ? "🟢 Kurz & Einfach erklärt" : "🔵 Original Prüfungs-Fakten (PDF)"}
                  </span>
                  <span class="text-xs font-semibold text-[var(--muted-foreground)]">
                    Merkwort: <strong class="text-[var(--foreground)]">${card.keyword}</strong>
                  </span>
                </div>
                <p class="text-base leading-relaxed">
                  ${state.easyMode ? card.easy : card.exam}
                </p>
              </div>

              <!-- Analogy / Eselsbrücke Box -->
              <div class="p-3.5 rounded-xl bg-[var(--secondary)] text-sm font-medium">
                ${card.analogy}
              </div>

              <!-- Show both option if student wants to compare -->
              ${state.easyMode ? `
                <details class="text-xs text-[var(--muted-foreground)] border border-[var(--border)] rounded-xl p-3">
                  <summary class="font-bold cursor-pointer select-none">🔍 Genaues Prüfungs-Wissen aus dem PDF anzeigen</summary>
                  <p class="mt-2 text-sm text-[var(--foreground)] leading-relaxed">${card.exam}</p>
                </details>
              ` : ""}
            </div>

            <!-- Card Progress Dots -->
            <div class="flex justify-center flex-wrap gap-1.5 py-2">
              ${lvl.cards.map((_, idx) => {
                const seen = state.seenCards[lvl.id]?.includes(idx);
                const active = idx === currentCardIndex;
                return `
                  <button onclick="jumpToCard(${idx})" class="h-2.5 rounded-full transition-all ${active ? "w-8 bg-[var(--primary)]" : seen ? "w-2.5 bg-emerald-500" : "w-2.5 bg-[var(--secondary)]"}" aria-label="Karte ${idx + 1}"></button>
                `;
              }).join("")}
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center justify-between gap-3 pt-4 border-t border-[var(--border)]">
              <button
                onclick="prevCard()"
                ${currentCardIndex === 0 ? "disabled" : ""}
                class="touch-btn px-4 py-2.5 rounded-xl border border-[var(--border)] text-sm font-bold disabled:opacity-40"
              >
                ← Zurück
              </button>

              ${currentCardIndex < lvl.cards.length - 1 ? `
                <button onclick="nextCard()" class="touch-btn flex-1 max-w-xs py-2.5 px-5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] text-sm font-bold">
                  Nächster Begriff (${currentCardIndex + 2}/${lvl.cards.length}) →
                </button>
              ` : `
                <button onclick="openLevel(${lvl.id}, 'game')" class="touch-btn flex-1 max-w-xs py-2.5 px-5 rounded-xl bg-emerald-600 text-white text-sm font-bold shadow-sm">
                  🎮 Weiter zum Praxis-Labor →
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function speakCurrentCard() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      const card = lvl.cards[currentCardIndex];
      const textToRead = `${card.term}. ${state.easyMode ? card.easy : card.exam}. ${card.analogy}`;
      speakText(textToRead);
    }

    function nextCard() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      if (currentCardIndex < lvl.cards.length - 1) {
        currentCardIndex++;
        renderCardsPhase();
      }
    }

    function prevCard() {
      if (currentCardIndex > 0) {
        currentCardIndex--;
        renderCardsPhase();
      }
    }

    function jumpToCard(idx) {
      currentCardIndex = idx;
      renderCardsPhase();
    }

    // ============================================================================
    // PHASE 2: INTERACTIVE MINI-GAMES (1 PER LEVEL)
    // ============================================================================
    let gameStep = 0;

    function renderGamePhase() {
      gameStep = 0;
      if (currentLevelId === 1) renderGameLevel1();
      else if (currentLevelId === 2) renderGameLevel2();
      else if (currentLevelId === 3) renderGameLevel3();
      else if (currentLevelId === 4) renderGameLevel4();
    }

    function completeMiniGame(levelId) {
      if (!state.completed[levelId].game) {
        state.completed[levelId].game = true;
        addXP(40, true);
      } else {
        addXP(10, true);
      }
      saveState();
    }

    // --- LEVEL 1 GAME: URL-Zerleger & Netzwerk-Check ---
    const LVL1_TASKS = [
      {
        prompt: "Mission 1/5: Tippe oben in der Adressleiste auf den Teil, der für die **sichere, verschlüsselte Übertragung** steht!",
        target: "https",
        success: "Stark! «https://» (mit dem s für secure) sorgt für eine verschlüsselte Übertragung."
      },
      {
        prompt: "Mission 2/5: Tippe in der Adressleiste auf die **Domain** (den eigentlichen Namen der Webseite)!",
        target: "domain",
        success: "Richtig! «wikipedia» ist die Domain."
      },
      {
        prompt: "Mission 3/5: Tippe auf die **Top-Level-Domain (TLD)** ganz am Ende der Adresse!",
        target: "tld",
        success: "Genau! «.org» (oder .at, .de, .ch, .com) ist die Top-Level-Domain."
      },
      {
        prompt: "Mission 4/5: Tippe auf den **Rechnernamen des Webservers**!",
        target: "www",
        success: "Perfekt! «www» ist laut PDF 3 der Rechnername des Webservers."
      },
      {
        prompt: "Mission 5/5: Wo klickst du drauf, um das **Digitale Zertifikat** (Echtheit der Webseite) zu kontrollieren?",
        target: "lock",
        success: "Volltreffer! Ein Klick auf das Vorhängeschloss zeigt das digitale Zertifikat der Webseite."
      }
    ];

    function renderGameLevel1() {
      const lvl = LEVELS[0];
      const main = document.getElementById("appMain");
      const isDone = gameStep >= LVL1_TASKS.length;
      if (isDone) completeMiniGame(1);

      const task = LVL1_TASKS[Math.min(gameStep, LVL1_TASKS.length - 1)];

      main.innerHTML = `
        <div class="animate-pop">
          ${renderLevelHeader(lvl)}

    // ============================================================================
    // PHASE 3: BOSS-QUIZ (ALL ORIGINAL PDF QUESTIONS + MASTERY QUEUE)
    // ============================================================================
    let quizQueue = [];
    let quizCurrent = null;
    let quizAnswered = false;
    let fill2Selection = { b1: null, b2: null };

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initQuizPhase() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      // Prepare shuffled questions and shuffled options
      quizQueue = lvl.quiz.map(q => {
        if (q.type === "mc") {
          const correctText = q.options[q.correct];
          const mixed = shuffleArray(q.options);
          return { ...q, mixedOptions: mixed, correctText };
        } else if (q.type === "fill") {
          return { ...q, mixedOptions: shuffleArray(q.options) };
        } else if (q.type === "fill2") {
          return {
            ...q,
            mixedBlank1: shuffleArray(q.blank1Options),
            mixedBlank2: shuffleArray(q.blank2Options)
          };
        }
        return q;
      });
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      quizAnswered = false;
      fill2Selection = { b1: null, b2: null };

      if (quizQueue.length === 0) {
        // Level Quiz Won!
        if (!state.completed[currentLevelId].quiz) {
          state.completed[currentLevelId].quiz = true;
          addXP(60, true);
        }
        saveState();
        renderQuizVictory();
        return;
      }

      quizCurrent = quizQueue[0];
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      const q = quizCurrent;
      const main = document.getElementById("appMain");

      let bodyHtml = "";

      if (q.type === "mc") {
        bodyHtml = `
          <div class="space-y-3">
            <p class="text-base sm:text-lg font-bold leading-snug">${q.question}</p>
            <div class="space-y-2.5 pt-2">
              ${q.mixedOptions.map((opt, idx) => `
                <button
                  id="qOpt_${idx}"
                  onclick="submitMCAnswer(${idx})"
                  class="touch-btn w-full text-left p-4 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-semibold text-sm sm:text-base flex items-center gap-3"
                >
                  <span class="w-7 h-7 rounded-lg bg-[var(--secondary)] flex items-center justify-center text-xs font-bold shrink-0">
                    ${String.fromCharCode(65 + idx)}
                  </span>
                  <span>${opt}</span>
                </button>
              `).join("")}
            </div>
          </div>
        `;
      } else if (q.type === "fill") {
        bodyHtml = `
          <div class="space-y-4">
            <div class="text-xs font-bold uppercase text-[var(--muted-foreground)]">${q.question}</div>
            <div class="p-4 rounded-2xl bg-[var(--background)] border-2 border-[var(--border)] text-base sm:text-lg font-semibold leading-relaxed">
              ${q.sentenceBefore}
              <span id="fillSlot" class="inline-block px-3 py-1 mx-1 rounded-lg bg-[var(--secondary)] border border-dashed border-[var(--foreground)] font-bold">
                ? ? ?
              </span>
              ${q.sentenceAfter}
            </div>
            <div class="text-xs text-[var(--muted-foreground)] font-medium">👇 Tippe auf das passende Wort für die Lücke:</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${q.mixedOptions.map((opt, idx) => `
                <button
                  onclick="submitFillAnswer(${idx})"
                  class="touch-btn p-3.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-bold text-sm"
                >
                  ${opt}
                </button>
              `).join("")}
            </div>
          </div>
        `;
      } else if (q.type === "fill2") {
        bodyHtml = `
          <div class="space-y-4">
            <div class="text-xs font-bold uppercase text-[var(--muted-foreground)]">${q.question}</div>
            <div class="p-4 rounded-2xl bg-[var(--background)] border-2 border-[var(--border)] text-base font-semibold leading-relaxed">
              ${q.sentencePart1}
              <span id="fill2Slot1" class="inline-block px-3 py-0.5 mx-1 rounded-lg bg-[var(--secondary)] border border-dashed border-[var(--foreground)] font-bold">
                ${fill2Selection.b1 || "1. Lücke"}
              </span>
              ${q.sentencePart2}
              <span id="fill2Slot2" class="inline-block px-3 py-0.5 mx-1 rounded-lg bg-[var(--secondary)] border border-dashed border-[var(--foreground)] font-bold">
                ${fill2Selection.b2 || "2. Lücke"}
              </span>
              ${q.sentencePart3}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-2">
                <div class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Auswahl für 1. Lücke:</div>
                ${q.mixedBlank1.map((w, i) => `
                  <button onclick="selectFill2(1, ${i})" class="touch-btn w-full p-3 rounded-xl border ${fill2Selection.b1 === w ? "border-[var(--primary)] bg-[var(--secondary)] font-extrabold" : "border-[var(--border)] bg-[var(--background)]"} text-sm font-semibold">
                    ${w}
                  </button>
                `).join("")}
              </div>
              <div class="space-y-2">
                <div class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Auswahl für 2. Lücke:</div>
                ${q.mixedBlank2.map((w, i) => `
                  <button onclick="selectFill2(2, ${i})" class="touch-btn w-full p-3 rounded-xl border ${fill2Selection.b2 === w ? "border-[var(--primary)] bg-[var(--secondary)] font-extrabold" : "border-[var(--border)] bg-[var(--background)]"} text-sm font-semibold">
                    ${w}
                  </button>
                `).join("")}
              </div>
            </div>
          </div>
        `;
      }

      main.innerHTML = `
        <div class="animate-pop">
          ${renderLevelHeader(lvl)}

          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-5 sm:p-6 space-y-5 shadow-sm">
            <div class="flex items-center justify-between border-b border-[var(--border)] pb-3">
              <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-[var(--secondary)]">
                🏆 Boss-Quiz • Noch ${quizQueue.length} ${quizQueue.length === 1 ? "Frage" : "Fragen"}
              </span>
              <button onclick="speakQuizQuestion()" class="touch-btn px-3 py-1 rounded-xl bg-[var(--secondary)] text-xs font-bold flex items-center gap-1">
                <span>🔊</span>
                <span>Frage vorlesen</span>
              </button>
            </div>

            ${renderMediaBox(getQuizImageKey(q.question + " " + (q.sentenceBefore || "") + " " + (q.sentencePart1 || "")), true)}

            ${bodyHtml}

            <div id="quizFeedbackBox" class="hidden p-4 rounded-xl space-y-3"></div>
          </div>
        </div>
      `;
    }

    function speakQuizQuestion() {
      const q = quizCurrent;
      if (!q) return;
      if (q.type === "mc") speakText(q.question + ". " + q.mixedOptions.join(". "));
      else if (q.type === "fill") speakText(q.sentenceBefore + " Lücke " + q.sentenceAfter);
      else if (q.type === "fill2") speakText(q.sentencePart1 + " erste Lücke " + q.sentencePart2 + " zweite Lücke " + q.sentencePart3);
    }

    function submitMCAnswer(idx) {
      if (quizAnswered) return;
      quizAnswered = true;
      const q = quizCurrent;
      const chosen = q.mixedOptions[idx];
      const isCorrect = chosen === q.correctText;
      showQuizFeedback(isCorrect, q.explanation);
    }

    function submitFillAnswer(idx) {
      if (quizAnswered) return;
      quizAnswered = true;
      const q = quizCurrent;
      const chosen = q.mixedOptions[idx];
      const slot = document.getElementById("fillSlot");
      if (slot) slot.textContent = chosen;
      const isCorrect = chosen === q.correct;
      showQuizFeedback(isCorrect, q.explanation);
    }

    function selectFill2(slotNum, idx) {
      if (quizAnswered) return;
      const q = quizCurrent;
      if (slotNum === 1) fill2Selection.b1 = q.mixedBlank1[idx];
      else fill2Selection.b2 = q.mixedBlank2[idx];

      renderQuizQuestion();

      if (fill2Selection.b1 && fill2Selection.b2) {
        quizAnswered = true;
        const isCorrect = fill2Selection.b1 === q.correct1 && fill2Selection.b2 === q.correct2;
        showQuizFeedback(isCorrect, q.explanation);
      }
    }

    function showQuizFeedback(isCorrect, explanation) {
      const box = document.getElementById("quizFeedbackBox");
      if (!box) return;
      box.classList.remove("hidden");

      if (isCorrect) {
        addXP(20, true);
        quizQueue.shift(); // Remove from queue
        box.className = "p-4 rounded-xl space-y-3 bg-emerald-500/15 border border-emerald-500/30";
        box.innerHTML = `
          <div class="font-bold text-emerald-500 text-base">✅ Richtig! (+20 XP)</div>
          <p class="text-sm">${explanation}</p>
          <button onclick="nextQuizQuestion()" class="touch-btn w-full sm:w-auto px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm">
            Weiter →
          </button>
        `;
      } else {
        resetStreak();
        // Move question to the end of the queue so student practices it again
        const missed = quizQueue.shift();
        quizQueue.push(missed);
        box.className = "p-4 rounded-xl space-y-3 bg-rose-500/15 border border-rose-500/30";
        box.innerHTML = `
          <div class="font-bold text-rose-500 text-base">❌ Noch nicht ganz! (Frage kommt am Schluss nochmal)</div>
          <p class="text-sm">${explanation}</p>
          <button onclick="nextQuizQuestion()" class="touch-btn w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] font-bold text-sm">
            Verstanden, nächste Frage →
          </button>
        `;
      }
    }

    function renderQuizVictory() {
      const lvl = LEVELS.find(l => l.id === currentLevelId);
      const main = document.getElementById("appMain");
      main.innerHTML = `
        <div class="animate-pop">
          ${renderLevelHeader(lvl)}

          <div class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 text-center space-y-4 shadow-sm">
            <div class="text-6xl">${lvl.badgeIcon}</div>
            <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-500 text-xs font-bold uppercase">
              Abzeichen freigeschaltet: ${lvl.badgeName}
            </div>
            <h2 class="text-2xl font-extrabold">${lvl.title} komplett gemeistert! 🎉</h2>
            <p class="text-sm text-[var(--muted-foreground)] max-w-md mx-auto">
              Du hast alle Prüfungsfragen aus diesem Bereich fehlerfrei beantwortet.
            </p>
            <div class="flex flex-wrap justify-center gap-3 pt-3">
              <button onclick="showDashboard()" class="touch-btn px-5 py-3 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] font-bold text-sm">
                🗺️ Zurück zur Level-Übersicht
              </button>
              <button onclick="openCertificate()" class="touch-btn px-5 py-3 rounded-xl border border-[var(--border)] bg-[var(--secondary)] font-bold text-sm">
                🏆 Abgabe-Pass anschauen
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // GLOSSARY / SPICKZETTEL MODAL (All 45 Terms Searchable)
    // ============================================================================
    function openGlossary() {
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalContent");
      overlay.classList.remove("hidden");

      const allCards = LEVELS.flatMap(l => l.cards.map(c => ({ ...c, levelTitle: l.title })));

      content.innerHTML = `
        <div class="p-4 sm:p-5 border-b border-[var(--border)] flex items-center justify-between gap-3">
          <div>
            <h3 class="font-bold text-lg">📖 Spickzettel & Lexikon (Alle Begriffe)</h3>
            <p class="text-xs text-[var(--muted-foreground)]">Suche nach jedem Begriff aus den 3 Arbeitsblättern</p>
          </div>
          <button onclick="closeModal()" class="touch-btn px-3 py-1.5 rounded-xl bg-[var(--secondary)] font-bold text-sm">
            ✕ Schliessen
          </button>
        </div>

        <div class="p-4 border-b border-[var(--border)] bg-[var(--background)]">
          <input
            type="text"
            placeholder="🔍 Begriff suchen (z. B. BCC, Cookie, Phishing, LAN, URL)..."
            oninput="filterGlossary(this.value)"
            class="w-full px-4 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-sm font-medium focus:outline-none"
          />
        </div>

        <div id="glossaryList" class="p-4 overflow-y-auto space-y-3 flex-1">
          ${renderGlossaryItems(allCards)}
        </div>
      `;
    }

    function renderGlossaryItems(items) {
      if (items.length === 0) {
        return `<div class="text-center py-8 text-sm text-[var(--muted-foreground)]">Kein Begriff gefunden.</div>`;
      }
      return items.map(c => `
        <div class="p-3.5 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <div class="font-bold text-sm sm:text-base flex items-center gap-2.5">
              <img src="${MEDIA_GALLERY[getCardImageKey(c.term)]?.src || ''}" onclick="openImageLightbox('${getCardImageKey(c.term)}')" class="w-12 h-9 rounded-lg object-cover border border-[var(--border)] cursor-pointer shrink-0" alt="${c.term}" />
              <span>${c.icon} ${c.term}</span>
            </div>
            <span class="text-xs px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--muted-foreground)] font-semibold shrink-0">
              ${c.pdfSource}
            </span>
          </div>
          <p class="text-xs sm:text-sm text-[var(--foreground)]"><strong>🟢 Einfach:</strong> ${c.easy}</p>
          <p class="text-xs text-[var(--muted-foreground)]"><strong>🔵 Prüfung:</strong> ${c.exam}</p>
        </div>
      `).join("");
    }

    function filterGlossary(query) {
      const q = query.toLowerCase().trim();
      const allCards = LEVELS.flatMap(l => l.cards);
      const filtered = allCards.filter(c =>
        c.term.toLowerCase().includes(q) ||
        c.easy.toLowerCase().includes(q) ||
        c.exam.toLowerCase().includes(q) ||
        c.keyword.toLowerCase().includes(q)
      );
      const container = document.getElementById("glossaryList");
      if (container) container.innerHTML = renderGlossaryItems(filtered);
    }

    // ============================================================================
    // CERTIFICATE / LEHRER-NACHWEIS MODAL
    // ============================================================================
    function openCertificate() {
      const overlay = document.getElementById("modalOverlay");
      const content = document.getElementById("modalContent");
      overlay.classList.remove("hidden");

      const now = new Date();
      const dateStr = now.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" });
      const timeStr = now.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });

      let completedCount = 0;
      LEVELS.forEach(l => {
        const c = state.completed[l.id];
        if (c.cards) completedCount++;
        if (c.game) completedCount++;
        if (c.quiz) completedCount++;
      });

      // Short verification hash based on name + xp + completedCount
      const code = "NC-" + ((state.studentName.length * 17 + state.xp * 3 + completedCount * 97) % 9000 + 1000);

      content.innerHTML = `
        <div class="p-4 sm:p-5 border-b border-[var(--border)] flex items-center justify-between">
          <div class="font-bold text-base sm:text-lg">🏆 Offizieller Abgabe-Pass (Lehrer-Nachweis)</div>
          <button onclick="closeModal()" class="touch-btn px-3 py-1.5 rounded-xl bg-[var(--secondary)] font-bold text-sm">
            ✕ Schliessen
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4">
          <div class="p-5 rounded-2xl border-2 border-[var(--primary)] bg-[var(--background)] space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border)] pb-3">
              <div>
                <div class="text-xs font-bold uppercase tracking-wider text-[var(--muted-foreground)]">Web-Führerschein • Online-Grundlagen 1–3</div>
                <div class="text-xl font-extrabold mt-0.5">
                  👤 ${state.studentName ? escapeHtml(state.studentName) : "Name noch nicht eingetragen"}
                </div>
              </div>
              <div class="text-right text-xs text-[var(--muted-foreground)] font-mono">
                <div>📅 ${dateStr} • ${timeStr}</div>
                <div class="font-bold text-[var(--foreground)]">Prüf-Code: ${code}</div>
              </div>
            </div>

            ${!state.studentName ? `
              <div class="p-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-xs font-semibold">
                ⚠️ Tipp: Trage unten deinen Namen ein, bevor du den Screenshot für deine Lehrperson machst:
                <input
                  type="text"
                  placeholder="Vorname & Nachname eingeben..."
                  oninput="updateStudentName(this.value); openCertificate();"
                  class="mt-2 w-full px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-sm font-bold"
                />
              </div>
            ` : ""}

            <!-- Key Stats -->
            <div class="grid grid-cols-3 gap-2.5 text-center">
              <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-xs text-[var(--muted-foreground)]">Gesamt-XP</div>
                <div class="text-lg font-extrabold">⚡ ${state.xp}</div>
              </div>
              <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-xs text-[var(--muted-foreground)]">Beste Serie</div>
                <div class="text-lg font-extrabold">🔥 ${state.bestStreak}</div>
              </div>
              <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-xs text-[var(--muted-foreground)]">Missionen</div>
                <div class="text-lg font-extrabold">✅ ${completedCount}/12</div>
              </div>
            </div>

            <!-- Detailed Level Breakdown -->
            <div class="space-y-2">
              ${LEVELS.map(l => {
                const c = state.completed[l.id];
                const all3 = c.cards && c.game && c.quiz;
                return `
                  <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] flex flex-wrap items-center justify-between gap-2 text-xs font-semibold">
                    <div class="flex items-center gap-2">
                      <span>${all3 ? l.badgeIcon : l.icon}</span>
                      <span>${l.title}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <span class="px-2 py-0.5 rounded ${c.cards ? "bg-emerald-500/20 text-emerald-500" : "bg-[var(--secondary)] text-[var(--muted-foreground)]"}">
                        Karten ${c.cards ? "✓" : "–"}
                      </span>
                      <span class="px-2 py-0.5 rounded ${c.game ? "bg-emerald-500/20 text-emerald-500" : "bg-[var(--secondary)] text-[var(--muted-foreground)]"}">
                        Praxis ${c.game ? "✓" : "–"}
                      </span>
                      <span class="px-2 py-0.5 rounded ${c.quiz ? "bg-emerald-500/20 text-emerald-500" : "bg-[var(--secondary)] text-[var(--muted-foreground)]"}">
                        Quiz ${c.quiz ? "✓" : "–"}
                      </span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="p-3.5 rounded-xl bg-[var(--secondary)] text-xs text-center font-medium">
            📸 <strong>So gibst du ab:</strong> Mach auf dem iPad einen Screenshot von diesem Fenster (Oben-Knopf + Lauter-Knopf gleichzeitig drücken) und zeig oder schick ihn deiner Lehrperson!
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.add("hidden");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Initialize App
    loadState();
    showDashboard();
  </script>
</body>
</html>
