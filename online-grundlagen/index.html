    // ============================================================================
    // STATE MANAGEMENT
    // ============================================================================
    const STORAGE_KEY = "webfuehrerschein_v2";
    let state = {
      name: "",
      solvedSteps: { 1: [], 2: [], 3: [], 4: [] }
    };

    let activeLevelId = null;
    let activeStepIndex = 0;
    let currentShuffledOptions = [];
    let stepAnsweredCorrectly = false;

    // State for "pairs" matching game
    let pairsState = {
      leftItems: [],
      rightItems: [],
      selectedLeftIdx: null,
      matchedLeftIndices: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.name = parsed.name || "";
          if (parsed.solvedSteps) {
            state.solvedSteps = { ...state.solvedSteps, ...parsed.solvedSteps };
          }
        }
      } catch (e) {}
      updateTopScore();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateTopScore();
    }

    function getTotalProgress() {
      let total = 0;
      let done = 0;
      LEVELS.forEach(lvl => {
        total += lvl.steps.length;
        done += (state.solvedSteps[lvl.id] || []).length;
      });
      return { total, done, pct: total > 0 ? Math.round((done / total) * 100) : 0 };
    }

    function updateTopScore() {
      const el = document.getElementById("topScore");
      if (el) el.textContent = getTotalProgress().pct;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ============================================================================
    // AUDIO VORLESEN
    // ============================================================================
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "de-DE";
      u.rate = 0.96;
      window.speechSynthesis.speak(u);
    }

    // ============================================================================
    // STARTSEITE
    // ============================================================================
    function showHome() {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      activeLevelId = null;
      const prog = getTotalProgress();
      const main = document.getElementById("mainView");

      main.innerHTML = `
        <div class="space-y-5 animate-step">

          <div class="bg-[var(--card)] border-2 border-[var(--border)] rounded-2xl p-5 shadow-xs space-y-4">
            <h1 class="text-xl sm:text-2xl font-extrabold">
              👋 Willkommen beim Web-Führerschein!
            </h1>
            <p class="text-base text-[var(--muted-foreground)] leading-relaxed">
              So einfach geht's: Trage unten deinen Namen ein und arbeite die <b>4 kurzen Levels</b> durch. Dich erwarten abwechslungsreiche Mini-Aufgaben (Paare verbinden, Lückentexte, Richtig/Falsch & Quiz)!
            </p>

            <div class="p-3.5 rounded-xl bg-[var(--secondary)] flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <label for="nameInput" class="font-bold text-sm">
                1️⃣ Dein Vorname & Nachname:
              </label>
              <input
                id="nameInput"
                type="text"
                placeholder="Hier Namen eintippen..."
                value="${escapeHtml(state.name)}"
                oninput="state.name = this.value.trim(); saveState();"
                class="px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-base font-bold w-full sm:w-64 focus:outline-none"
              />
            </div>

            <div class="pt-1">
              <div class="flex justify-between text-sm font-bold mb-1.5">
                <span>Gesamt-Fortschritt (${prog.done} von ${prog.total} Aufgaben geschafft)</span>
                <span>${prog.pct}%</span>
              </div>
              <div class="w-full h-3.5 bg-[var(--secondary)] rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 transition-all duration-300 rounded-full" style="width: ${prog.pct}%"></div>
              </div>
            </div>
          </div>

          <div class="space-y-3">
            <div class="font-bold text-sm uppercase tracking-wider text-[var(--muted-foreground)] px-1">
              2️⃣ Wähle dein Level:
            </div>

            ${LEVELS.map(lvl => {
              const doneCount = (state.solvedSteps[lvl.id] || []).length;
              const totalCount = lvl.steps.length;
              const isFinished = doneCount >= totalCount;

              return `
                <div class="bg-[var(--card)] border-2 ${isFinished ? "border-emerald-500/60" : "border-[var(--border)]"} rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-xs">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2.5">
                      <span class="text-2xl">${lvl.icon}</span>
                      <h2 class="font-extrabold text-lg">${lvl.title}</h2>
                    </div>
                    <p class="text-sm text-[var(--muted-foreground)]">${lvl.subtitle}</p>
                    <div class="text-xs font-bold pt-1 ${isFinished ? "text-emerald-500" : "text-[var(--muted-foreground)]"}">
                      ${isFinished ? "✅ Komplett erledigt!" : `Fortschritt: ${doneCount} von ${totalCount} erledigt`}
                    </div>
                  </div>

                  <button
                    onclick="startLevel(${lvl.id})"
                    class="touch-btn px-5 py-3 rounded-xl font-extrabold text-base shrink-0 ${isFinished ? "bg-[var(--secondary)] text-[var(--secondary-foreground)]" : "bg-[var(--primary)] text-[var(--primary-foreground)] shadow-sm"}"
                  >
                    ${doneCount === 0 ? "▶️ Level starten" : isFinished ? "🔄 Nochmals üben" : "▶️ Weitermachen"}
                  </button>
                </div>
              `;
            }).join("")}
          </div>

        </div>
      `;
    }

    // ============================================================================
    // LEVEL-ANSICHT MIT 4 VERSCHIEDENEN AUFGABEN-ARTEN
    // ============================================================================
    function startLevel(levelId) {
      activeLevelId = levelId;
      const lvl = LEVELS.find(l => l.id === levelId);
      const solved = state.solvedSteps[levelId] || [];

      let firstUnsolved = 0;
      for (let i = 0; i < lvl.steps.length; i++) {
        if (!solved.includes(i)) {
          firstUnsolved = i;
          break;
        }
      }
      openStep(firstUnsolved);
    }

    function openStep(stepIdx) {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      if (!lvl) return;

      if (stepIdx >= lvl.steps.length) {
        renderLevelComplete(lvl);
        return;
      }

      activeStepIndex = stepIdx;
      stepAnsweredCorrectly = false;
      const step = lvl.steps[stepIdx];

      if (step.taskType === "mc") {
        const tagged = step.options.map((text, idx) => ({ text, isCorrect: idx === 0 }));
        currentShuffledOptions = shuffle(tagged);
      } else if (step.taskType === "fill") {
        currentShuffledOptions = shuffle(step.words);
      } else if (step.taskType === "pairs") {
        pairsState = {
          leftItems: step.pairs.map((p, idx) => ({ text: p.left, pairId: idx })),
          rightItems: shuffle(step.pairs.map((p, idx) => ({ text: p.right, pairId: idx }))),
          selectedLeftIdx: 0, // Auto-select first left item so student immediately sees what to match!
          matchedLeftIndices: []
        };
      }

      renderActiveStep();
    }

    function getTaskBadgeLabel(type) {
      if (type === "fill") return "🧩 Lückentext – tippe auf das passende Wort";
      if (type === "truefalse") return "⚖️ Stimmt das oder Quatsch?";
      if (type === "pairs") return "🔗 Verbinde die 3 passenden Paare";
      return "🎯 Auswahl-Frage – tippe auf die richtige Antwort";
    }

    function renderTaskArea(step) {
      if (step.taskType === "mc") {
        return `
          <p class="text-base sm:text-lg font-extrabold leading-snug">
            ${step.question}
          </p>
          <div class="space-y-2.5">
            ${currentShuffledOptions.map((opt, idx) => `
              <button
                id="optBtn_${idx}"
                onclick="checkMCAnswer(${idx})"
                class="touch-btn w-full text-left p-4 rounded-xl border-2 border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-bold text-sm sm:text-base flex items-center gap-3"
              >
                <span class="w-8 h-8 rounded-lg bg-[var(--secondary)] flex items-center justify-center text-sm font-extrabold shrink-0">
                  ${idx + 1}
                </span>
                <span>${opt.text}</span>
              </button>
            `).join("")}
          </div>
        `;
      }

      if (step.taskType === "fill") {
        return `
          <div class="p-4 rounded-xl bg-[var(--background)] border-2 border-[var(--border)] text-base sm:text-lg font-bold leading-relaxed">
            ${step.sentenceBefore}
            <span id="fillBlankBox" class="inline-block px-3.5 py-1 mx-1 rounded-lg bg-[var(--secondary)] border-2 border-dashed border-[var(--primary)] text-[var(--primary)] font-extrabold">
              ? ? ?
            </span>
            ${step.sentenceAfter}
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-1">
            ${currentShuffledOptions.map((word, idx) => `
              <button
                id="fillBtn_${idx}"
                onclick="checkFillAnswer(${idx})"
                class="touch-btn p-3.5 rounded-xl border-2 border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-extrabold text-sm sm:text-base text-center"
              >
                ${word}
              </button>
            `).join("")}
          </div>
        `;
      }

      if (step.taskType === "truefalse") {
        return `
          <div class="p-4 rounded-xl bg-[var(--background)] border-2 border-[var(--border)] text-base sm:text-lg font-extrabold leading-snug">
            ${step.statement}
          </div>
          <div class="grid grid-cols-2 gap-3 pt-1">
            <button
              id="tfBtn_true"
              onclick="checkTrueFalse(true)"
              class="touch-btn p-4 rounded-xl border-2 border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-extrabold text-base flex items-center justify-center gap-2"
            >
              <span>👍</span>
              <span>Ja / Stimmt</span>
            </button>
            <button
              id="tfBtn_false"
              onclick="checkTrueFalse(false)"
              class="touch-btn p-4 rounded-xl border-2 border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)] font-extrabold text-base flex items-center justify-center gap-2"
            >
              <span>👎</span>
              <span>Nein / Falsch</span>
            </button>
          </div>
        `;
      }

      if (step.taskType === "pairs") {
        return `
          <p class="text-sm sm:text-base font-extrabold">
            ${step.question} <span class="font-normal text-[var(--muted-foreground)]">(Links Begriff wählen → rechts passende Erklärung antippen)</span>
          </p>
          <div id="pairsBoard" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
            ${renderPairsColumns()}
          </div>
        `;
      }

      return "";
    }

    function renderPairsColumns() {
      const leftHtml = pairsState.leftItems.map((item, idx) => {
        const isMatched = pairsState.matchedLeftIndices.includes(idx);
        const isSelected = pairsState.selectedLeftIdx === idx && !isMatched;
        return `
          <button
            onclick="selectLeftPair(${idx})"
            ${isMatched ? "disabled" : ""}
            class="touch-btn w-full text-left p-3.5 rounded-xl border-2 font-extrabold text-sm flex items-center justify-between gap-2 ${
              isMatched
                ? "border-emerald-500 bg-emerald-500/15 text-emerald-500 opacity-80"
                : isSelected
                ? "border-[var(--primary)] bg-[var(--secondary)]"
                : "border-[var(--border)] bg-[var(--background)]"
            }"
          >
            <span>${item.text}</span>
            <span>${isMatched ? "✅" : isSelected ? "👉" : ""}</span>
          </button>
        `;
      }).join("");

      const rightHtml = pairsState.rightItems.map((item, rIdx) => {
        const isMatched = pairsState.matchedLeftIndices.includes(item.pairId);
        return `
          <button
            id="rightPair_${rIdx}"
            onclick="selectRightPair(${rIdx})"
            ${isMatched ? "disabled" : ""}
            class="touch-btn w-full text-left p-3.5 rounded-xl border-2 font-bold text-xs sm:text-sm flex items-center justify-between gap-2 ${
              isMatched
                ? "border-emerald-500 bg-emerald-500/15 text-emerald-500 opacity-80"
                : "border-[var(--border)] bg-[var(--background)] hover:bg-[var(--secondary)]"
            }"
          >
            <span>${item.text}</span>
            <span>${isMatched ? "✅" : ""}</span>
          </button>
        `;
      }).join("");

      return `
        <div class="space-y-2">
          <div class="text-xs font-extrabold uppercase text-[var(--muted-foreground)]">1. Begriff:</div>
          ${leftHtml}
        </div>
        <div class="space-y-2">
          <div class="text-xs font-extrabold uppercase text-[var(--muted-foreground)]">2. Passende Bedeutung:</div>
          ${rightHtml}
        </div>
      `;
    }

    function renderActiveStep() {
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      const step = lvl.steps[activeStepIndex];
      const totalSteps = lvl.steps.length;
      const pct = Math.round((activeStepIndex / totalSteps) * 100);

      const main = document.getElementById("mainView");
      main.innerHTML = `
        <div class="space-y-4 animate-step">

          <!-- Fortschritt oben im Level -->
          <div class="flex items-center justify-between gap-3 px-1">
            <span class="text-sm font-bold text-[var(--muted-foreground)]">
              ${lvl.icon} ${lvl.title}
            </span>
            <span class="text-sm font-extrabold px-3 py-1 rounded-full bg-[var(--secondary)]">
              Schritt ${activeStepIndex + 1} von ${totalSteps}
            </span>
          </div>
          <div class="w-full h-2.5 bg-[var(--secondary)] rounded-full overflow-hidden">
            <div class="h-full bg-[var(--primary)] transition-all duration-300" style="width: ${pct}%"></div>
          </div>

          <!-- TEIL 1: EINFACHE ERKLÄRUNG -->
          <div class="bg-[var(--card)] border-2 border-[var(--border)] rounded-2xl p-5 sm:p-6 shadow-xs space-y-4">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-3">
                <span class="text-3xl">${step.icon}</span>
                <h2 class="text-xl sm:text-2xl font-extrabold">${step.title}</h2>
              </div>
              <button
                onclick="speakStep()"
                class="touch-btn px-3.5 py-2 rounded-xl bg-[var(--secondary)] font-bold text-xs sm:text-sm flex items-center gap-1.5 shrink-0"
              >
                <span>🔊</span>
                <span>Vorlesen</span>
              </button>
            </div>

            <div class="text-base sm:text-lg leading-relaxed p-4 rounded-xl bg-[var(--background)] border border-[var(--border)]">
              ${step.simpleText}
            </div>

            <div class="text-sm font-semibold px-4 py-3 rounded-xl bg-[var(--secondary)]">
              💡 ${step.tip}
            </div>
          </div>

          <!-- TEIL 2: ABWECHSLUNGSREICHE AUFGABE -->
          <div class="bg-[var(--card)] border-2 border-[var(--border)] rounded-2xl p-5 sm:p-6 shadow-xs space-y-4">
            <div class="inline-block text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full bg-[var(--secondary)] text-[var(--secondary-foreground)]">
              ${getTaskBadgeLabel(step.taskType)}
            </div>

            ${renderTaskArea(step)}

            <!-- Rückmeldung + Weiter-Knopf -->
            <div id="answerFeedback" class="hidden p-4 rounded-xl space-y-3"></div>
          </div>

          <!-- Zurück Navigation unten -->
          <div class="flex justify-between items-center pt-1">
            <button
              onclick="${activeStepIndex > 0 ? `openStep(${activeStepIndex - 1})` : `showHome()`}"
              class="touch-btn px-4 py-2 rounded-xl text-sm font-bold text-[var(--muted-foreground)] hover:bg-[var(--secondary)]"
            >
              ← ${activeStepIndex > 0 ? "Vorheriger Begriff" : "Zurück zur Übersicht"}
            </button>
          </div>

        </div>
      `;
    }

    function speakStep() {
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      const step = lvl.steps[activeStepIndex];
      const extra = step.question || step.statement || (step.sentenceBefore + " Lücke " + step.sentenceAfter);
      speak(`${step.title}. ${step.simpleText}. ${step.tip}. ${extra}`);
    }

    // ============================================================================
    // AUSWERTUNGS-FUNKTIONEN FÜR ALLE 4 AUFGABEN-ARTEN
    // ============================================================================
    function markStepSolved() {
      stepAnsweredCorrectly = true;
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      const step = lvl.steps[activeStepIndex];

      if (!state.solvedSteps[lvl.id]) state.solvedSteps[lvl.id] = [];
      if (!state.solvedSteps[lvl.id].includes(activeStepIndex)) {
        state.solvedSteps[lvl.id].push(activeStepIndex);
        saveState();
      }

      const fb = document.getElementById("answerFeedback");
      if (!fb) return;
      fb.classList.remove("hidden");
      fb.className = "p-4 rounded-xl space-y-3 bg-emerald-500/15 border-2 border-emerald-500/50 animate-step";
      fb.innerHTML = `
        <div class="font-extrabold text-base text-emerald-500">
          ✅ Super, das ist richtig!
        </div>
        <p class="text-sm font-medium">${step.feedback}</p>
        <button
          onclick="openStep(${activeStepIndex + 1})"
          class="touch-btn w-full py-3.5 px-6 rounded-xl bg-emerald-600 text-white font-extrabold text-base shadow-sm"
        >
          Weiter zum nächsten Schritt →
        </button>
      `;
    }

    function showWrongFeedback(customHint) {
      const fb = document.getElementById("answerFeedback");
      if (!fb) return;
      fb.classList.remove("hidden");
      fb.className = "p-4 rounded-xl space-y-2 bg-rose-500/15 border-2 border-rose-500/40 animate-step";
      fb.innerHTML = `
        <div class="font-extrabold text-base text-rose-500">
          ❌ ${customHint || "Nicht ganz! Schau oben nochmal kurz auf die fettgedruckten Wörter und probier es nochmal."}
        </div>
      `;
    }

    // 1. Multiple Choice
    function checkMCAnswer(chosenIdx) {
      if (stepAnsweredCorrectly) return;
      const chosen = currentShuffledOptions[chosenIdx];
      const btn = document.getElementById(`optBtn_${chosenIdx}`);

      if (chosen.isCorrect) {
        if (btn) {
          btn.className = "touch-btn w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-500/15 font-extrabold text-sm sm:text-base flex items-center gap-3";
        }
        markStepSolved();
      } else {
        if (btn) {
          btn.className = "touch-btn w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-500/15 font-bold text-sm sm:text-base flex items-center gap-3 opacity-75";
        }
        showWrongFeedback();
      }
    }

    // 2. Fill in the blank
    function checkFillAnswer(idx) {
      if (stepAnsweredCorrectly) return;
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      const step = lvl.steps[activeStepIndex];
      const word = currentShuffledOptions[idx];
      const btn = document.getElementById(`fillBtn_${idx}`);
      const blankBox = document.getElementById("fillBlankBox");

      if (word === step.correctWord) {
        if (blankBox) {
          blankBox.textContent = word;
          blankBox.className = "inline-block px-3.5 py-1 mx-1 rounded-lg bg-emerald-500 text-white font-extrabold";
        }
        if (btn) {
          btn.className = "touch-btn p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-500/15 font-extrabold text-sm sm:text-base text-center";
        }
        markStepSolved();
      } else {
        if (btn) {
          btn.className = "touch-btn p-3.5 rounded-xl border-2 border-rose-500 bg-rose-500/15 font-bold text-sm sm:text-base text-center opacity-70";
        }
        showWrongFeedback("Dieses Wort passt nicht in die Lücke. Probier ein anderes!");
      }
    }

    // 3. True / False
    function checkTrueFalse(userSaidTrue) {
      if (stepAnsweredCorrectly) return;
      const lvl = LEVELS.find(l => l.id === activeLevelId);
      const step = lvl.steps[activeStepIndex];
      const btn = document.getElementById(userSaidTrue ? "tfBtn_true" : "tfBtn_false");

      if (userSaidTrue === step.isTrue) {
        if (btn) {
          btn.className = "touch-btn p-4 rounded-xl border-2 border-emerald-500 bg-emerald-500/15 font-extrabold text-base flex items-center justify-center gap-2";
        }
        markStepSolved();
      } else {
        if (btn) {
          btn.className = "touch-btn p-4 rounded-xl border-2 border-rose-500 bg-rose-500/15 font-bold text-base flex items-center justify-center gap-2 opacity-75";
        }
        showWrongFeedback("Umgekehrt! Lies die Behauptung und den Text oben noch einmal genau.");
      }
    }

    // 4. Pairs Matching
    function selectLeftPair(leftIdx) {
      if (stepAnsweredCorrectly) return;
      if (pairsState.matchedLeftIndices.includes(leftIdx)) return;
      pairsState.selectedLeftIdx = leftIdx;
      const board = document.getElementById("pairsBoard");
      if (board) board.innerHTML = renderPairsColumns();
    }

    function selectRightPair(rightIdx) {
      if (stepAnsweredCorrectly) return;
      if (pairsState.selectedLeftIdx === null) {
        showWrongFeedback("Tippe zuerst links auf einen Begriff!");
        return;
      }

      const rightItem = pairsState.rightItems[rightIdx];
      if (rightItem.pairId === pairsState.selectedLeftIdx) {
        // Match!
        pairsState.matchedLeftIndices.push(pairsState.selectedLeftIdx);

        // Select next unmatched left item automatically
        let nextUnmatched = null;
        for (let i = 0; i < pairsState.leftItems.length; i++) {
          if (!pairsState.matchedLeftIndices.includes(i)) {
            nextUnmatched = i;
            break;
          }
        }
        pairsState.selectedLeftIdx = nextUnmatched;

        const board = document.getElementById("pairsBoard");
        if (board) board.innerHTML = renderPairsColumns();

        // Hide any previous wrong feedback
        const fb = document.getElementById("answerFeedback");
        if (fb) fb.classList.add("hidden");

        // All pairs matched?
        if (pairsState.matchedLeftIndices.length >= pairsState.leftItems.length) {
          markStepSolved();
        }
      } else {
        const rightBtn = document.getElementById(`rightPair_${rightIdx}`);
        if (rightBtn) {
          rightBtn.classList.add("border-rose-500", "bg-rose-500/15");
        }
        showWrongFeedback("Das gehört noch nicht zusammen – probier eine andere Erklärung rechts!");
      }
    }

    function renderLevelComplete(lvl) {
      const main = document.getElementById("mainView");
      main.innerHTML = `
        <div class="bg-[var(--card)] border-2 border-emerald-500/60 rounded-2xl p-6 text-center space-y-4 shadow-sm animate-step">
          <div class="text-6xl">🎉</div>
          <h2 class="text-2xl font-extrabold">${lvl.title} geschafft!</h2>
          <p class="text-base text-[var(--muted-foreground)]">
            Stark! Du hast alle ${lvl.steps.length} Begriffe und Aufgaben in diesem Level gelöst.
          </p>
          <div class="flex flex-col sm:flex-row justify-center gap-3 pt-2">
            <button
              onclick="showHome()"
              class="touch-btn px-6 py-3.5 rounded-xl bg-[var(--primary)] text-[var(--primary-foreground)] font-extrabold text-base"
            >
              🏠 Weiter zum nächsten Level
            </button>
            <button
              onclick="openPass()"
              class="touch-btn px-6 py-3.5 rounded-xl bg-[var(--secondary)] text-[var(--secondary-foreground)] font-bold text-base"
            >
              🏆 Meinen Abgabe-Pass zeigen
            </button>
          </div>
        </div>
      `;
    }

    // ============================================================================
    // BEGRIFFE A-Z & ABGABE-PASS
    // ============================================================================
    function openLexikon() {
      const backdrop = document.getElementById("modalBackdrop");
      const box = document.getElementById("modalBox");
      backdrop.classList.remove("hidden");

      const allSteps = LEVELS.flatMap(l => l.steps);

      box.innerHTML = `
        <div class="p-4 border-b border-[var(--border)] flex items-center justify-between">
          <h3 class="font-extrabold text-lg">📖 Alle Begriffe einfach erklärt</h3>
          <button onclick="closeModal()" class="touch-btn px-3.5 py-1.5 rounded-xl bg-[var(--secondary)] font-bold text-sm">
            ✕ Schliessen
          </button>
        </div>
        <div class="p-3 border-b border-[var(--border)] bg-[var(--background)]">
          <input
            type="text"
            placeholder="🔍 Begriff suchen (z. B. BCC, Cookie, Phishing, LAN)..."
            oninput="filterLexikon(this.value)"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[var(--card)] border border-[var(--border)] text-sm font-bold focus:outline-none"
          />
        </div>
        <div id="lexikonItems" class="p-4 overflow-y-auto space-y-3 flex-1">
          ${renderLexikonList(allSteps)}
        </div>
      `;
    }

    function renderLexikonList(items) {
      if (items.length === 0) {
        return `<div class="text-center py-8 text-sm text-[var(--muted-foreground)]">Kein passender Begriff gefunden.</div>`;
      }
      return items.map(s => `
        <div class="p-3.5 rounded-xl border border-[var(--border)] bg-[var(--background)] space-y-1.5">
          <div class="font-extrabold text-base flex items-center gap-2">
            <span>${s.icon}</span>
            <span>${s.title}</span>
          </div>
          <p class="text-sm leading-relaxed">${s.simpleText}</p>
        </div>
      `).join("");
    }

    function filterLexikon(q) {
      const query = q.toLowerCase().trim();
      const allSteps = LEVELS.flatMap(l => l.steps);
      const filtered = allSteps.filter(s =>
        s.title.toLowerCase().includes(query) ||
        s.simpleText.toLowerCase().includes(query)
      );
      const el = document.getElementById("lexikonItems");
      if (el) el.innerHTML = renderLexikonList(filtered);
    }

    function openPass() {
      const backdrop = document.getElementById("modalBackdrop");
      const box = document.getElementById("modalBox");
      backdrop.classList.remove("hidden");

      const prog = getTotalProgress();
      const now = new Date();
      const dateStr = now.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" });
      const timeStr = now.toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });

      box.innerHTML = `
        <div class="p-4 border-b border-[var(--border)] flex items-center justify-between">
          <h3 class="font-extrabold text-lg">🏆 Dein Abgabe-Pass</h3>
          <button onclick="closeModal()" class="touch-btn px-3.5 py-1.5 rounded-xl bg-[var(--secondary)] font-bold text-sm">
            ✕ Schliessen
          </button>
        </div>

        <div class="p-5 overflow-y-auto space-y-4">
          <div class="p-5 rounded-2xl border-2 border-[var(--primary)] bg-[var(--background)] space-y-4">
            <div class="flex flex-wrap justify-between items-center gap-2 border-b border-[var(--border)] pb-3">
              <div>
                <div class="text-xs font-bold uppercase text-[var(--muted-foreground)]">Web-Führerschein</div>
                <div class="text-xl font-extrabold">
                  👤 ${state.name ? escapeHtml(state.name) : "Name noch nicht eingetragen"}
                </div>
              </div>
              <div class="text-xs font-bold text-[var(--muted-foreground)]">
                📅 ${dateStr} • ${timeStr}
              </div>
            </div>

            <div class="text-center py-2">
              <div class="text-3xl font-extrabold">${prog.pct}% geschafft</div>
              <div class="text-sm text-[var(--muted-foreground)]">(${prog.done} von ${prog.total} Aufgaben richtig gelöst)</div>
            </div>

            <div class="space-y-2">
              ${LEVELS.map(lvl => {
                const done = (state.solvedSteps[lvl.id] || []).length;
                const total = lvl.steps.length;
                const ok = done >= total;
                return `
                  <div class="p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] flex items-center justify-between text-sm font-bold">
                    <span>${lvl.icon} ${lvl.title}</span>
                    <span class="${ok ? "text-emerald-500" : "text-[var(--muted-foreground)]"}">
                      ${ok ? "✅ Fertig" : `${done}/${total}`}
                    </span>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="p-3.5 rounded-xl bg-[var(--secondary)] text-xs sm:text-sm text-center font-bold">
            📸 Mach jetzt einen Screenshot von diesem Fenster und zeig ihn deiner Lehrperson!
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.add("hidden");
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let isDarkTheme = false;
    function toggleThemeMode() {
      isDarkTheme = !isDarkTheme;
      document.body.classList.toggle("custom-dark", isDarkTheme);
      document.body.classList.toggle("custom-light", !isDarkTheme);
      const iconEl = document.getElementById("themeToggleIcon");
      const textEl = document.getElementById("themeToggleText");
      if (iconEl) iconEl.textContent = isDarkTheme ? "☀️" : "🌙";
      if (textEl) textEl.textContent = isDarkTheme ? "Hellmodus" : "Dunkelmodus";
    }

    document.body.classList.add("custom-light");
    loadState();
    showHome();
  </script>
</body>
</html>
