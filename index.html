<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medien & Informatik – Lernportal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    .touch-btn {
      min-height: 48px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-btn:active {
      transform: scale(0.98);
    }
    body.custom-light {
      --background: #f8fafc;
      --foreground: #0f172a;
      --card: #ffffff;
      --border: #cbd5e1;
      --secondary: #e2e8f0;
      --secondary-foreground: #0f172a;
      --muted-foreground: #475569;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
    }
    body.custom-dark {
      --background: #0b0f19;
      --foreground: #f8fafc;
      --card: #151c2c;
      --border: #334155;
      --secondary: #1e293b;
      --secondary-foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
    }
    .bg-card { background-color: var(--card); }
    .bg-secondary { background-color: var(--secondary); }
    .bg-primary { background-color: var(--primary); }
    .text-foreground { color: var(--foreground); }
    .text-muted { color: var(--muted-foreground); }
    .text-secondary-fg { color: var(--secondary-foreground); }
    .text-primary-fg { color: var(--primary-foreground); }
    .border-theme { border-color: var(--border); }
  </style>
</head>
<body class="custom-light antialiased min-h-screen pb-16">

  <!-- KOPFZEILE -->
  <header class="sticky top-0 z-30 bg-card border-b border-theme px-4 py-3 shadow-xs">
    <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">💻</span>
        <div>
          <div class="font-extrabold text-base sm:text-lg leading-tight">Medien & Informatik</div>
          <div class="text-xs text-muted font-semibold">Interaktives Lernportal</div>
        </div>
      </div>

      <button id="themeToggleBtn" onclick="toggleThemeMode()" class="touch-btn px-3.5 py-2 rounded-xl border border-theme bg-secondary text-secondary-fg font-bold text-sm flex items-center gap-1.5">
        <span id="themeToggleIcon">🌙</span>
        <span id="themeToggleText">Dunkelmodus</span>
      </button>
    </div>
  </header>

  <!-- HAUPTBEREICH -->
  <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

    <!-- Begrüssung -->
    <section class="bg-card border-2 border-theme rounded-2xl p-5 sm:p-6 space-y-2 shadow-xs">
      <h1 class="text-xl sm:text-2xl font-extrabold">👋 Wähle dein Thema</h1>
      <p class="text-sm sm:text-base text-muted leading-relaxed">
        Hier findest du alle interaktiven Übungen für dein iPad. Tippe auf ein aktives Thema, um direkt zu starten.
      </p>
    </section>

    <!-- Aktive Themen -->
    <section class="space-y-3">
      <div class="text-xs font-extrabold uppercase tracking-wider text-muted px-1">
        ✅ Verfügbare Lernmodule
      </div>
      <div id="readyGrid" class="grid grid-cols-1 gap-4"></div>
    </section>

    <!-- Zukünftige Themen -->
    <section class="space-y-3 pt-2">
      <div class="text-xs font-extrabold uppercase tracking-wider text-muted px-1">
        🚧 Geplante Themen (folgen bald)
      </div>
      <div id="soonGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
    </section>

  </main>

  <script>
    // =========================================================================
    // HIER KÖNNEN NEUE SUBSEITEN GANZ EINFACH HINZUGEFÜGT ODER FREIGESCHALTET WERDEN:
    // status: "ready" = anklickbar | status: "soon" = ausgegraut ("Bald verfügbar")
    // =========================================================================
    const MODULES = [
      {
        title: "Online-Grundlagen (Web-Führerschein)",
        description: "Browser, URL, E-Mail (CC/BCC), Phishing, Cookies, Datenschutz & Urheberrecht – in 4 einfachen Levels.",
        icon: "🌐",
        url: "./online-grundlagen/",
        status: "ready",
        badge: "4 Levels • iPad-Training"
      },
      {
        title: "Textverarbeitung & Formatierung",
        description: "Texte sauber gestalten, Schriftarten, Absätze, Tabellen und Seitenränder richtig einsetzen.",
        icon: "📝",
        url: "./textverarbeitung/",
        status: "soon",
        badge: "In Vorbereitung"
      },
      {
        title: "Tabellenkalkulation (Excel / Calc)",
        description: "Zellen, einfache Formeln (Summe, Mittelwert) und Diagramme verständlich erklärt.",
        icon: "📊",
        url: "./tabellenkalkulation/",
        status: "soon",
        badge: "In Vorbereitung"
      },
      {
        title: "Präsentationen gestalten",
        description: "Folien übersichtlich aufbauen, Bilder richtig einsetzen und sicher präsentieren.",
        icon: "📽️",
        url: "./praesentationen/",
        status: "soon",
        badge: "In Vorbereitung"
      },
      {
        title: "Algorithmen & Coding",
        description: "Schleifen, Bedingungen (Wenn-Dann) und logisches Denken Schritt für Schritt üben.",
        icon: "🤖",
        url: "./coding/",
        status: "soon",
        badge: "In Vorbereitung"
      }
    ];

    function renderModules() {
      const readyGrid = document.getElementById("readyGrid");
      const soonGrid = document.getElementById("soonGrid");

      const ready = MODULES.filter(m => m.status === "ready");
      const soon = MODULES.filter(m => m.status !== "ready");

      readyGrid.innerHTML = ready.map(m => `
        <a href="${m.url}" class="block bg-card border-2 border-theme hover:border-blue-500 rounded-2xl p-5 shadow-xs transition-colors">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1.5">
              <div class="flex items-center gap-2.5 flex-wrap">
                <span class="text-3xl">${m.icon}</span>
                <h2 class="text-lg sm:text-xl font-extrabold">${m.title}</h2>
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600">
                  ${m.badge}
                </span>
              </div>
              <p class="text-sm text-muted leading-relaxed">${m.description}</p>
            </div>
            <span class="touch-btn px-5 py-3 rounded-xl bg-primary text-primary-fg font-extrabold text-sm sm:text-base inline-flex items-center justify-center shrink-0">
              ▶️ Öffnen
            </span>
          </div>
        </a>
      `).join("");

      soonGrid.innerHTML = soon.map(m => `
        <div class="bg-card border border-theme rounded-2xl p-4 opacity-75 flex flex-col justify-between gap-3">
          <div class="space-y-1.5">
            <div class="flex items-center justify-between gap-2">
              <span class="text-2xl">${m.icon}</span>
              <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-secondary text-secondary-fg">
                ⏳ ${m.badge}
              </span>
            </div>
            <h3 class="font-extrabold text-base">${m.title}</h3>
            <p class="text-xs sm:text-sm text-muted leading-relaxed">${m.description}</p>
          </div>
        </div>
      `).join("");
    }

    let isDarkTheme = false;
    function toggleThemeMode() {
      isDarkTheme = !isDarkTheme;
      document.body.classList.toggle("custom-dark", isDarkTheme);
      document.body.classList.toggle("custom-light", !isDarkTheme);
      document.getElementById("themeToggleIcon").textContent = isDarkTheme ? "☀️" : "🌙";
      document.getElementById("themeToggleText").textContent = isDarkTheme ? "Hellmodus" : "Dunkelmodus";
    }

    renderModules();
  </script>
</body>
</html>
